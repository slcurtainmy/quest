<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SL Curtain Marketing Quest</title>
<style>
:root{
  --bg:#FBF6F4; --card:#FFFFFF; --ink:#4B3A44; --muted:#7A6A72; --line:#F0E3E1; --shadow-c:rgba(150,80,95,.10);
  --lav:#9C4F63; --lav2:#D99AA5; --lav-soft:#F7DFDF; --lav-dark:#82394D; --lav-hover:#F2CFCF; --lav-line:#F0CFD0; --lav-line2:#E3AEB3; --lav-tint:#FFF9F8; --hero2:#FBEAE8; --mid:#EFBDBD;
  --blue:#7E95C4; --blue-soft:#EAF1FB; --sand:#F9E8E6;
  --lab:#5E5A9C; --lab-dark:#4B4880; --lab-line:#D9D7EF; --lab-line2:#BBB7E5; --lab-soft:#EFEEF9; --lab-tint:#F7F6FC; --lab-chip:#E4E2F4;
  --ok:#55702F; --ok-soft:#E6EDD3; --warn-soft:#FBF1DC; --warn:#7A5A12;
  --r:18px; --shadow:0 6px 24px var(--shadow-c);
}
:root[data-theme=butter]{
  --bg:#FCFAF0; --ink:#473F2C; --muted:#766C56; --line:#EBE5CF; --shadow-c:rgba(120,100,30,.12);
  --lav:#7E6212; --lav2:#E0CB78; --lav-soft:#F7F1CE; --lav-dark:#624C0B; --lav-hover:#EFE7B4; --lav-line:#EBE2A8; --lav-line2:#D9C56A; --lav-tint:#FFFDF2; --hero2:#FBF6DC; --mid:#F3EDBD;
  --blue:#8DA0C8; --blue-soft:#EAF1FB; --sand:#F6F0D3;
  --lab:#55702B; --lab-dark:#435A22; --lab-line:#D7E2BC; --lab-line2:#B6C687; --lab-soft:#EEF3E0; --lab-tint:#F7FAF0; --lab-chip:#E3EBCB;
  --ok:#55702F; --ok-soft:#E4ECCF;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:"Iowan Old Style",Georgia,"Times New Roman",serif;font-weight:600;margin:0;line-height:1.2}
h1{font-size:clamp(1.6rem,4vw,2.3rem)}
h2{font-size:1.35rem;margin-bottom:.4rem}
h3{font-size:1.1rem}
p{margin:.3rem 0}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 60px}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:#fff;padding:8px;z-index:99}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin:16px 0}
.muted{color:var(--muted)}.small{font-size:.88rem}
.eyebrow{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--lav);font-weight:600;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn{border:0;border-radius:999px;padding:10px 18px;background:var(--lav);color:#fff;font-weight:600;transition:transform .15s,background .15s}
.btn:hover{background:var(--lav-dark);transform:translateY(-1px)}
.btn.ghost{background:var(--lav-soft);color:var(--lav)}
.btn.ghost:hover{background:var(--lav-hover)}
.btn.sm{padding:6px 12px;font-size:.88rem}
.btn.danger{background:#fff;color:#8a3b3b;border:1px solid #e3c6c6}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
textarea{resize:vertical}
label{display:block;font-size:.88rem;font-weight:600;margin:10px 0 4px}
label.inline{display:flex;gap:8px;align-items:center;font-weight:500;font-size:.95rem}

/* hero */
.hero{background:linear-gradient(135deg,#fff 0%,var(--hero2) 100%)}
.hero-top{display:flex;justify-content:space-between;gap:16px;align-items:center}
.micro{color:var(--lav);font-style:italic;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 12px}
.stat{min-width:0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .big{font-size:2rem;font-family:Georgia,serif;font-weight:600;color:var(--lav);line-height:1}
.stat .lbl{font-size:.8rem;color:var(--muted);display:block}
.stat input[type=date]{margin:2px 0;min-width:0;max-width:100%;padding:6px 8px}
.bar{height:14px;border-radius:99px;background:var(--lav-soft);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lav2),var(--mid));border-radius:99px;transition:width .6s cubic-bezier(.3,1.3,.5,1)}
.trail{list-style:none;display:flex;justify-content:space-between;padding:0;margin:12px 0 0}
.node{flex:1;text-align:center;font-size:.72rem;color:var(--muted)}
.node span{display:grid;place-items:center;width:28px;height:28px;margin:0 auto 2px;border-radius:50%;border:2px solid var(--line);background:#fff;font-weight:700;font-size:.8rem}
.node.done span{background:var(--lav);border-color:var(--lav);color:#fff}
.node.cur span{border-color:var(--lav);color:var(--lav);box-shadow:0 0 0 4px var(--lav-soft)}
.node em{font-style:normal;display:block}
.next{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--lav-soft);border-radius:14px;padding:12px 16px;margin-top:16px}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pausebar{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:10px 16px;margin:12px 0 0;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0;margin-top:8px}
.tab{border:0;background:transparent;padding:9px 16px;border-radius:999px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-selected=true]{background:var(--lav);color:#fff}
.tab:hover:not([aria-selected=true]){background:var(--lav-soft)}

/* tasks */
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:14px;margin:8px 0;background:#fff;transition:background .3s}
.task.open{background:var(--lav-tint);border-color:var(--lav-line)}
.task.s-done .ttitle{text-decoration:line-through;color:var(--muted)}
.task.s-skipped,.task.s-deferred{background:#FAF8F4}
.tbody{flex:1;min-width:0}
.ttitle{background:none;border:0;padding:0;text-align:left;font-weight:600;font-size:1.02rem}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.badge{font-size:.74rem;padding:2px 9px;border-radius:99px;background:var(--sand);color:var(--ink)}
.badge.opt{background:var(--blue-soft);color:var(--lab)}
.badge.st{background:var(--lav-soft);color:var(--lav)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.details{margin-top:10px}
.details textarea{min-height:56px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.reasonbox{margin-top:10px;padding:10px;background:var(--sand);border-radius:12px}
input.chk{appearance:none;-webkit-appearance:none;flex:none;width:28px;height:28px;margin:0;border:2px solid var(--lav-line2);border-radius:50%;background:#fff;cursor:pointer;display:grid;place-items:center;transition:all .2s}
input.chk:checked{background:var(--lav);border-color:var(--lav)}
input.chk:checked::after{content:"✓";color:#fff;font-weight:700;font-size:.95rem}
.task.popping{animation:pop .5s ease}
.task.popping{background:var(--lav-soft)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}

.stagehead{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;background:none;border:0;padding:4px 0;text-align:left}
.stagehead .t{display:flex;gap:10px;align-items:center}
.emo{font-size:1.5rem}
.stagenote{background:var(--blue-soft);border-radius:12px;padding:8px 12px;font-size:.9rem;margin:8px 0}
details.park summary{cursor:pointer;color:var(--muted);margin-top:12px}

/* decide */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pcard{border:2px solid var(--line);border-radius:16px;padding:14px;background:#fff}
.pcard.sel{border-color:var(--lav);background:var(--lav-tint)}
.calc{background:var(--sand);border-radius:12px;padding:8px 12px;margin:10px 0;font-size:.95rem}
.calc b{font-size:1.05rem}
.tag{display:inline-block;font-size:.72rem;border-radius:99px;padding:1px 8px;margin-left:4px}
.tag.est{background:var(--warn-soft);color:var(--warn)}
.tag.ver{background:var(--ok-soft);color:var(--ok)}
.tag.hyp{background:var(--blue-soft);color:var(--lab)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.ready{border-radius:14px;padding:12px 16px;margin:10px 0}
.ready.no{background:var(--warn-soft);color:#5d430b}
.ready.yes{background:var(--ok-soft);color:#255a40}
ul.plain{list-style:none;padding:0;margin:8px 0}
ul.plain li{padding:2px 0}

/* results */
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 12px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.metric{background:var(--lav-soft);border-radius:12px;padding:8px 12px}
.metric b{display:block;font-size:1.15rem;color:var(--lav)}
.metric span{font-size:.78rem;color:var(--muted)}
.entry{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.msg{color:#8a3b3b;font-size:.9rem;margin-top:8px}

/* wins */
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stamp{border:2px dashed var(--line);border-radius:14px;padding:10px;text-align:center;font-size:.85rem;color:var(--muted)}
.stamp.on{border:2px solid var(--lav);background:var(--lav-soft);color:var(--ink)}
.stamp .emo{display:block}

/* toast / confetti */
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:all .3s;z-index:50;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.big{border-radius:20px;background:var(--lav);font-size:1.15rem;padding:18px 26px}
#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
#confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.8}}
dialog{border:0;border-radius:var(--r);padding:22px;max-width:440px;width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(45,42,62,.4)}
/* lab */
.tab.labtab{border:1px dashed var(--lab-line2);color:var(--lab)}
.tab.labtab[aria-selected=true]{background:var(--lab);color:#fff;border-style:solid}
.card.lab{background:var(--lab-soft);border:1px solid var(--lab-line);box-shadow:none}
.card.lab .btn{background:var(--lab)}.card.lab .btn:hover{background:var(--lab-dark)}
.card.lab .btn.ghost{background:var(--lab-chip);color:var(--lab)}
.recbox{background:#fff;border:1px solid var(--lab-line);border-radius:14px;padding:12px 16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--lab-line2);background:#fff;color:var(--lab);border-radius:99px;padding:5px 12px;font-size:.88rem}
.chip.on{background:var(--lab);color:#fff;border-color:var(--lab)}
.mod{background:#fff;border:1px solid var(--lab-line);border-radius:14px;padding:10px 14px;margin:10px 0}
.lrow{padding:8px 0;border-top:1px solid var(--lab-line)}
.ltitle{background:none;border:0;padding:0;font-weight:600;text-align:left;margin-right:6px}
.badge.lb-now{background:var(--lab-chip);color:var(--lab-dark)}.badge.lb-next{background:var(--lav-soft);color:var(--lav-dark)}
.lesson{margin-top:8px;padding:12px;background:var(--lab-tint);border-radius:12px}
.lesson textarea[readonly]{background:#fff;font-size:.85rem}
.trackbox{margin-top:12px;padding:12px;border-radius:12px;background:#fff;border:1px solid var(--lab-line)}
.lesson ul{margin:4px 0 8px;padding-left:20px}
/* mascot */
.mascot{position:relative;display:flex;align-items:center;flex:none}
.mbtn{background:none;border:0;padding:0;line-height:0;border-radius:50%}
.mbtn svg{width:104px;height:104px;overflow:visible}
.bubble{position:absolute;right:100%;top:6px;margin-right:2px;background:#fff;border:1px solid var(--lav-line);color:var(--lav);border-radius:16px;padding:7px 12px;font-size:.85rem;font-weight:600;width:max-content;max-width:190px;box-shadow:0 4px 14px var(--shadow-c);z-index:5}
.bubble[hidden]{display:none}
.bubble::after{content:"";position:absolute;right:-6px;top:14px;width:10px;height:10px;background:#fff;border-right:1px solid var(--lav-line);border-top:1px solid var(--lav-line);transform:rotate(45deg)}
.m-body{fill:var(--lav-soft);stroke:var(--lav-line2);stroke-width:2}
.m-fold{fill:none;stroke:var(--lav-line);stroke-width:2;stroke-linecap:round}
.m-feet{fill:var(--lav-line2)}.m-shadow{fill:var(--lav-line);opacity:.6}
.m-ink{fill:var(--ink)}.m-white{fill:#fff}.m-cheek{fill:var(--mid);opacity:.85}
.m-arc{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.m-tassel{fill:none;stroke:var(--lav);stroke-width:2.4;stroke-linecap:round}.m-knot{fill:var(--lav)}
.m-spark{fill:var(--lav2)}.m-zz{fill:var(--lav);font:700 11px Georgia,serif}
.mascot .eyes-happy,.mascot .eyes-sleep,.mascot .mouth-open,.mascot .zz,.mascot .sparks{display:none}
.mg{transform-box:fill-box;transform-origin:center bottom;animation:mbob 3.2s ease-in-out infinite}
.eyes-open{transform-box:fill-box;transform-origin:center;animation:mblink 4.5s infinite}
.mascot[data-mood=cheer] .eyes-open,.mascot[data-mood=party] .eyes-open,.mascot[data-mood=sleepy] .eyes-open{display:none}
.mascot[data-mood=cheer] .eyes-happy,.mascot[data-mood=party] .eyes-happy{display:inline}
.mascot[data-mood=cheer] .mouth-smile,.mascot[data-mood=party] .mouth-smile,.mascot[data-mood=sleepy] .mouth-smile{display:none}
.mascot[data-mood=cheer] .mouth-open,.mascot[data-mood=party] .mouth-open{display:inline}
.mascot[data-mood=cheer] .mg{animation:mjump .75s ease-out 1}
.mascot[data-mood=party] .mg{animation:mjump .6s ease-out 5}
.mascot[data-mood=party] .sparks{display:inline}
.mascot[data-mood=party] .m-spark{animation:mtwinkle .6s ease-in-out infinite alternate}
.mascot[data-mood=sleepy] .eyes-sleep,.mascot[data-mood=sleepy] .zz{display:inline}
.mascot[data-mood=sleepy] .mg{animation:mbreathe 3.6s ease-in-out infinite}
@keyframes mbob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-3px) scale(1.02,.98)}}
@keyframes mblink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes mjump{0%{transform:scale(1.08,.88)}35%{transform:translateY(-18px) scale(.95,1.06)}70%{transform:translateY(0) scale(1.08,.9)}100%{transform:scale(1,1)}}
@keyframes mbreathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
@keyframes mtwinkle{from{opacity:.3;transform:scale(.7)}to{opacity:1;transform:scale(1.1)}}
/* focuspilot */
.sr{position:absolute;left:-999px}
.card.fp{border-left:4px solid var(--lav-line2)}
.card.fp.hero2{background:linear-gradient(135deg,#fff,var(--hero2))}
.card.fp .chip{border-color:var(--lav-line2);color:var(--lav)}
.card.fp .chip.on{background:var(--lav);color:#fff;border-color:var(--lav)}
.fpitem{border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:8px 0;background:#fff}
.fpitem.q-now{border-color:var(--lav-line2);background:var(--lav-tint)}
.fpitem.isdone .ttitle{text-decoration:line-through;color:var(--muted)}
.prev{display:flex;gap:10px;align-items:center;margin:6px 0}
.scorebox{background:var(--sand);border-radius:12px;padding:10px 14px;margin-top:10px}
.studybox{background:var(--lab-soft);border:1px solid var(--lab-line);border-radius:12px;padding:10px 14px;margin-top:10px}
.optlist{display:grid;gap:8px;margin:8px 0}
.optlist .btn{text-align:left}
dialog .actions .btn{flex:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

@media (max-width:720px){
  .stats{grid-template-columns:1fr 1fr}
  .pgrid,.g2,.g4{grid-template-columns:1fr}
  .stamps{grid-template-columns:1fr 1fr}
  .node em{display:none}
  .mbtn svg{width:76px;height:76px}
  .bubble{right:0;top:100%;margin-top:4px;margin-right:0}
  .bubble::after{display:none}
}
.printonly{display:none}
@media print{
  body{background:#fff}
  .mascot,.tabs,.btn,.actions,.hero-actions,.next .btn,#toast,#confetti,#datasec,.skip,.reasonbox,.pausebar .btn{display:none!important}
  .printonly{display:block}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid-page}
  .task{break-inside:avoid}
  input.chk{border-color:#555}
  .stat input[type=date]{border:0;padding:0}
}
</style>
</head>

<a class="skip" href="#view">Skip to content</a>
<noscript><p style="padding:20px">This tracker needs JavaScript to run. Please open it in a normal browser.</p></noscript>
<div class="wrap">

    <h2 id="datahead">Your data</h2>
    <p class="small muted">Everything you enter is saved in <b>this browser, on this device</b> (browser localStorage). It does not sync to other devices or browsers, and clearing your browser's site data will erase it. Use <b>Export backup</b> now and then, and <b>Import backup</b> to restore it somewhere else.</p>
    <p class="small" id="storewarn" style="color:#8a3b3b"></p>

      <button class="btn ghost sm" data-act="print">🖨 Print view</button>
      <button class="btn danger sm" data-act="reset">Reset everything</button>
    </div>
  </section>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="confetti" aria-hidden="true"></div>
<dialog id="dlg" aria-labelledby="dlgh"></dialog>

<script>
(function(){
'use strict';
var APP='sl-curtain-marketing-quest', STORE_KEY='slq_v1';

/* ---------- content ---------- */
var STAGES=[
 {id:1,emo:'🧭',short:'Choose',title:'Choose the opportunity',note:'The figures are estimates from your notes. Verify them first, and don’t just pick the highest margin.',tasks:[
  {t:'Review the three candidate products',m:10,d:'You have looked at all three cards in the comparison panel.',link:'decide'},
  {t:'Verify selling price and cost assumptions with Mom',m:15,d:'Price and cost are confirmed or corrected in the panel and “Verified” is ticked.',link:'decide'},
  {t:'Compare estimated gross profit and GPM',m:10,d:'You have read profit per job and margin side by side, and rated the four “fit” rows.',link:'decide'},
  {t:'Select ONE product for the first test',m:10,d:'One product is chosen in the panel. The others are parked, not deleted.',link:'decide'},
  {t:'Record why I chose it',m:10,d:'One or two sentences are saved in the “Why this product” box.',link:'decide'}]},
 {id:2,emo:'💬',short:'Customer',title:'Understand the customer',note:'This is a hypothesis to test, not a proven insight. Short answers are fine.',tasks:[
  {t:'Define the specific customer segment',m:15,d:'“Target customer” on the hypothesis card says who, where and in what situation.',link:'decide'},
  {t:'Identify one plausible customer problem',m:15,d:'“Customer problem” is one sentence, ideally in the customer’s own words.',link:'decide'},
  {t:'Write one marketing hypothesis',m:15,d:'“Proposed benefit” and “Main assumption to test” are filled in.',link:'decide'},
  {t:'Separate known facts from assumptions',m:15,opt:1,d:'“Supporting evidence” lists only what you actually know (past jobs, real enquiries). Everything else is labelled an assumption.',link:'decide'},
  {t:'Define why SL Curtain is a suitable solution',m:10,d:'One sentence on why SL Curtain fits this customer, based on strengths you can back up.'}]},
 {id:3,emo:'📸',short:'Evidence',title:'Find the evidence',note:'Use what already exists. You do not need to organise the whole media library for this test.',tasks:[
  {t:'Locate the project photos or videos for the chosen product',m:20,d:'You know which files show this project. Nothing has been reorganised.'},
  {t:'Select the strongest 3–5 visual assets',m:20,d:'3–5 files are picked. More is not better.'},
  {t:'Identify what the project demonstrates',m:10,opt:1,d:'One line on what a viewer can actually see (e.g. light, finish, fit).'},
  {t:'Confirm the service details with Mom',m:15,d:'What is included, installation and timing are confirmed for anything you will mention.'},
  {t:'Mark any unsupported claims for removal',m:10,d:'Anything you cannot prove or deliver (e.g. “cheapest”, specific timelines) is crossed out of your notes.'}]},
 {id:4,emo:'✍️',short:'Create',title:'Create the advertisement',note:'One angle, one headline, one visual. Done is better than endlessly polishing.',tasks:[
  {t:'Choose one main creative angle',m:15,d:'One angle is picked (e.g. before/after, convenience, personal guidance). Just one.'},

var actx=null;
function audio(){
  try{ if(!actx){ var C=window.AudioContext||window.webkitAudioContext; if(!C) return null; actx=new C(); }
    if(actx.state==='suspended') actx.resume(); return actx; }catch(e){ return null; }
}
function tone(f,t0,dur,vol,type){
  var a=audio(); if(!a) return;
  var o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+dur+0.05);
}

  tone(784,t,0.16,0.11); tone(1175,t+0.07,0.26,0.09); tone(2349,t+0.07,0.12,0.02,'triangle'); }
function playMile(){ if(!S.sound) return; var a=audio(); if(!a) return; var t=a.currentTime+0.01;
  [523,659,784,1047,1319].forEach(function(f,i){ tone(f,t+i*0.09,0.32,0.09); }); }

function confetti(){

function setStatus(id,status,reason){
  var before=progress().pct, r=ensureTask(id);
  r.status=status; r.reason=reason||''; r.doneAt=status==='done'?todayISO():'';
  save(); ui.reason=null;
  var after=progress().pct;
  if(status==='done'){
    ui.q=(ui.q+1)%QUOTES.length;
    var row=$('#t-'+id); if(row) row.classList.add('popping');
    renderOverview();
    var passed=[25,50,75,100].filter(function(m){return before<m&&after>=m&&S.celebrated.indexOf(m)<0;});
    if(passed.length){ passed.forEach(function(m){S.celebrated.push(m);}); save(); toast(MILES[passed[passed.length-1]],true); confetti(); playMile(); mascotReact('party',passed[passed.length-1]+'% — look at you!',3200); }
    else { playDone(); mascotReact('cheer',pick(CHEER),1500); toast(WINS_MSG[Math.floor(Math.random()*WINS_MSG.length)]); }
    setTimeout(render,520);
  } else render();
}

function numOrNull(x){ if(x===undefined||x==='') return null; var n=parseFloat(x); return isFinite(n)&&n>=0?n:NaN; }

function act(a,ds){
  var id=ds.id;
  if(a.indexOf('fp')===0){ fpAct(a,ds); return; }
  switch(a){
    case 'tab': ui.tab=ds.tab; ui.msg=''; ui.from=''; render(); window.scrollTo({top:$('#tabs').offsetTop-8}); break;
    case 'focus': ui.tab='start'; ui.open=id; render(); var el=$('#t-'+id); if(el) el.scrollIntoView({block:'center'}); break;
    case 'open': ui.open=(ui.open===id||(ui.open===null&&ui.tab==='start'&&nextTasks(1)[0]&&nextTasks(1)[0].id===id))?'':id; render(); break;
    case 'stage': var cs=currentStage(), cur=(+id in ui.exp)?ui.exp[+id]:(cs&&cs.id===+id); ui.exp[+id]=!cur; render(); break;
    case 'done': setStatus(id,'done'); break;
    case 'undo': setStatus(id,'open'); break;
    case 'ask': ui.reason={id:id,kind:ds.kind}; ui.open=id; renderView(); break;
    case 'reasonno': ui.reason=null; renderView(); break;
    case 'reasonok': var inp=$('#reasonIn'), txt=inp?inp.value.trim():''; setStatus(ui.reason.id,ui.reason.kind,txt||'No reason given'); break;
    case 'pick': S.product=(S.product===id)?'':id; save(); render(); break;
    case 'boop': mascotReact(S.paused?'sleepy':'cheer',S.paused?'Zzz… hm?':pick(BOOPS),1100); if(S.sound){ var ac=audio(); if(ac) tone(1047,ac.currentTime+0.01,0.14,0.08); } break;
    case 'sound': S.sound=!S.sound; save(); render(); if(S.sound) playDone(); break;
    case 'theme': S.theme=S.theme==='butter'?'rose':'butter'; save(); render(); break;
    case 'reschedule': openDlg(); break;
    case 'dlgcancel': closeDlg(); break;
    case 'dlgsave': var dt=$('#dlgDate').value; if(/^\d{4}-\d{2}-\d{2}$/.test(dt)) S.milestone=dt; S.paused=$('#dlgPause').checked; S.pauseNote=$('#dlgNote').value.trim(); save(); closeDlg(); render(); toast('Saved. Dates move, progress stays.'); break;
    case 'resume': S.paused=false; save(); render(); toast('Welcome back. One small step is plenty.'); break;
    case 'export': download('SL_Curtain_Marketing_Quest_backup_'+todayISO()+'.json',JSON.stringify({app:APP,version:1,exportedAt:new Date().toISOString(),data:S},null,2)); toast('Backup downloaded.'); break;
    case 'import': $('#imp').click(); break;
    case 'print': window.print(); break;
    case 'reset':
      if(confirm('Reset everything? This clears all progress, notes and results in this browser. Export a backup first if you might want it back.')){
        try{localStorage.removeItem(STORE_KEY);}catch(e){}
        S=defaults(); ui.fpOpen=''; ui.fpPrev=null; ui.tri=null; ui.tab='start'; ui.open=null; ui.exp={}; ui.reason=null; ui.draft={}; ui.editing=''; ui.msg=''; render(); toast('Fresh start.'); }
      break;
    case 'study': ui.tab='lab'; ui.lesson=id; ui.from=ds.from||''; ui.labFilter='all'; var lm=LESSONS.filter(function(x){return x.id===id;})[0]; if(lm) ui.mod[lm.m]=true; render(); var le=$('#les-'+id); if(le) le.scrollIntoView({block:'start'}); break;
    case 'openlesson': ui.lesson=(ui.lesson===id)?'':id; ui.from=''; var lm2=LESSONS.filter(function(x){return x.id===id;})[0]; if(lm2&&ui.lesson){ ui.mod[lm2.m]=true; var lb=lessonLabel(lm2); if(ui.labFilter!=='all'&&ui.labFilter!==lb&&!(ui.labFilter==='later'&&lb==='review')) ui.labFilter='all'; } render(); var le2=$('#les-'+id); if(le2) le2.scrollIntoView({block:'start'}); break;
    case 'backtask': var bt=taskById[ui.from]; ui.tab='roadmap'; if(bt){ ui.exp[bt.stage]=true; ui.open=bt.id; } ui.from=''; render(); var be=bt&&$('#t-'+bt.id); if(be) be.scrollIntoView({block:'center'}); break;
    case 'labfilter': ui.labFilter=ds.f; renderView(); break;
    case 'labmod': ui.mod[+id]=(ds.ex!=='true'); renderView(); break;
    case 'copy': var lc=LESSONS.filter(function(x){return x.id===id;})[0]; if(lc) copyText(promptFor(lc,ds.item?fpItem(ds.item):null)).then(function(ok){ toast(ok?'Prompt copied. Paste it into NotebookLM.':'Couldn’t copy automatically. Select the text in the prompt box and copy it.'); }); break;
    case 'addres': addResult(); break;
    case 'reschan': ui.draft.channel=ds.c==='b2b'?'b2b':'ads'; renderView(); break;
    case 'canceledit': ui.editing=''; ui.draft={}; ui.msg=''; renderView(); break;
    case 'editres':
      var e=S.results.filter(function(x){return x.id===id;})[0]; if(!e) break;
      ui.draft={from:e.from,to:e.to,product:e.product,obs:e.obs,channel:e.channel||'ads'}; NUMF.forEach(function(k){ui.draft[k]=e[k]==null?'':String(e[k]);});
      ui.editing=id; ui.msg=''; renderView(); window.scrollTo({top:$('#view').offsetTop-8}); break;
    case 'delres': if(confirm('Delete this result entry?')){ S.results=S.results.filter(function(x){return x.id!==id;}); save(); if(ui.editing===id){ui.editing='';ui.draft={};} render(); } break;
  }
}
function addResult(){
  var d=ui.draft, e={id:ui.editing||('r'+Date.now()),from:d.from||'',to:d.to||'',product:d.product||'',obs:(d.obs||'').trim(),channel:d.channel==='b2b'?'b2b':'ads'}, bad=false, any=false;
  NUMF.forEach(function(k){ var n=numOrNull(d[k]); if(n!==null&&isNaN(n)) bad=true; e[k]=(n===null||isNaN(n))?null:n; if(e[k]!=null) any=true; });
  if(bad) ui.msg='Numbers need to be zero or more.';
  else if(e.qual!=null&&e.enq!=null&&e.qual>e.enq) ui.msg='Qualified leads can’t be more than '+(e.channel==='b2b'?'referrals received':'enquiries')+'. Please check those two.';
  else if(e.repl!=null&&e.cont!=null&&e.repl>e.cont) ui.msg='Replies can’t be more than prospects contacted. Please check those two.';
  else if(e.from&&e.to&&e.to<e.from) ui.msg='The end date is before the start date.';
  else if(!any&&!e.obs&&!e.from&&!e.to) ui.msg='Add at least one number or a note first.';
  else {
    var i=-1; S.results.forEach(function(x,j){if(x.id===e.id) i=j;});
    if(i>=0) S.results[i]=e; else S.results.push(e);
    save(); ui.draft={channel:e.channel}; ui.editing=''; ui.msg=''; render(); toast('Logged. Thank you for noting it down.'); return;
  }
  renderView();
}

function importFile(inp){
  var f=inp.files&&inp.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){
    var obj; try{ obj=JSON.parse(rd.result); }catch(e){ obj=null; }
    if(!obj||obj.app!==APP||!obj.data||typeof obj.data!=='object'){ toast('That file doesn’t look like a Quest backup. Nothing was changed.'); inp.value=''; return; }
    if(confirm('Replace everything currently in this browser with the backup'+(obj.exportedAt?' from '+fmtDate(String(obj.exportedAt).slice(0,10)):'')+'?')){
      S=sanitize(obj.data); save(); ui.draft={}; ui.editing=''; ui.reason=null; render(); toast('Backup restored.'); }
    inp.value='';
  };
  rd.onerror=function(){ toast('Couldn’t read that file.'); };
  rd.readAsText(f);
}
